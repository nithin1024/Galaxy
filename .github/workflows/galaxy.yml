name: GitHub Contribution Galaxy Workflow

on:
  schedule:
    # Run automatically every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual triggering from GitHub Actions tab

permissions:
  contents: write

jobs:
  generate-galaxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Contribution Galaxy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python generate.py

      - name: Commit and Push Generated Output
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/galaxy.svg output/stats.json
          
          # Only commit if output files changed
          if git diff --staged --quiet; then
            echo "No changes in generated files. Skipping commit."
          else
            git commit -m "chore: update contribution galaxy"
            git push
          fi
