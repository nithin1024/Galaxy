name: GitHub Contribution Galaxy Workflow

on:
  schedule:
    # Run automatically every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual triggering from GitHub Actions tab

permissions:
  contents: write

jobs:
  generate-galaxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Contribution Galaxy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python generate.py

      - name: Record Daily Maintenance
        run: |
          mkdir -p activity

          TODAY=$(date -u '+%Y-%m-%d')

          if grep -q "^Automated Galaxy maintenance: $TODAY" activity/daily-maintenance.log 2>/dev/null; then
            echo "Maintenance already recorded for $TODAY"
          else
            echo "Automated Galaxy maintenance: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> activity/daily-maintenance.log
          fi

      - name: Commit and Push
        run: |
          git config --local user.name "nithin1024"
          git config --local user.email "149921092+nithin1024@users.noreply.github.com"

          git add output/galaxy.svg output/stats.json activity/daily-maintenance.log

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily galaxy maintenance"
            git push origin main
          fi
